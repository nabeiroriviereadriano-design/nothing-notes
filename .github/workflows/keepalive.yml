name: Maintien du serveur Supabase (offre gratuite)

# Les projets Supabase gratuits sont mis en pause après 7 jours sans
# activité. Cette tâche gratuite interroge le serveur tous les 3 jours.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger la base
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Secrets SUPABASE_URL / SUPABASE_ANON_KEY absents : rien à faire."; exit 0; fi
          curl -sS -o /dev/null -w "auth: %{http_code}\n" "$URL/auth/v1/health" -H "apikey: $KEY"
          curl -sS -o /dev/null -w "rest: %{http_code}\n" "$URL/rest/v1/notes?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
