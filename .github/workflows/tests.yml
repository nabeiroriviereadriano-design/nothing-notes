name: Tests

on:
  push:
    branches: [main, notion]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash   # active « pipefail » : un échec n'est jamais masqué par un tube

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Noyau + synchro locale chiffrée (Dart, vraies connexions TCP)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: packages/notes_core
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Base de test produite par le vrai code de Nothing Notes 2.0.0
        run: |
          git worktree add "$RUNNER_TEMP/v2" 6b89c98
          mkdir -p "$RUNNER_TEMP/v2/packages/notes_core/tool"
          cp tool/v2_fixture.dart "$RUNNER_TEMP/v2/packages/notes_core/tool/"
          (cd "$RUNNER_TEMP/v2/packages/notes_core" && dart pub get && dart run tool/v2_fixture.dart "$RUNNER_TEMP/v2.db" "$RUNNER_TEMP/v2-files")
          echo "NN_V2_FIXTURE=$RUNNER_TEMP/v2.db" >> "$GITHUB_ENV"
          echo "NN_V2_FILES=$RUNNER_TEMP/v2-files" >> "$GITHUB_ENV"
      - run: dart pub get
      - name: Analyse statique
        run: dart analyze 2>&1 | tee analyze.log
      - name: Tests unitaires et scénarios entre appareils
        run: dart test --concurrency=1 --reporter expanded --no-color 2>&1 | tee test.log
      - name: Résumé
        if: always()
        run: |
          {
            echo '### Analyse'; echo '```'; tail -n 60 analyze.log 2>/dev/null; echo '```'
            echo '### Tests'; echo '```'; (grep -E "\[E\]|Some tests failed|All tests passed|^\s+(Expected|Actual|Which)" test.log 2>/dev/null || true) | tail -n 80; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-logs
          path: packages/notes_core/*.log

