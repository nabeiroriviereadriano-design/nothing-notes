name: Sauvegarde de la base

# Sauvegarde chiffrée hebdomadaire de la base Supabase (voir docs/SAUVEGARDE.md).
on:
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Export chiffré
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then
            echo "Secrets SUPABASE_DB_URL / BACKUP_PASSPHRASE absents : sauvegarde non configurée."
            exit 0
          fi
          D=$(date -u +%F)
          docker run --rm -e DB_URL postgres:17 sh -c \
            'pg_dump "$DB_URL" --data-only --schema=public --schema=auth --no-owner --no-privileges \
               --exclude-table=auth.schema_migrations --exclude-table=auth.audit_log_entries' > dump.sql
          test -s dump.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" \
              --symmetric --cipher-algo AES256 --output "nothing-notes-$D.sql.gpg" dump.sql
          shred -u dump.sql
          ls -la *.gpg
          echo "D=$D" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: env.D != ''
        with:
          name: sauvegarde-${{ env.D }}
          path: '*.sql.gpg'
          retention-days: 90
