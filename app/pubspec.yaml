name: nothing_notes
description: Nothing Notes — prise de notes minimaliste synchronisée entre Android et Windows.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  notes_core:
    path: ../packages/notes_core
  crypto: ^3.0.3
  file_picker: ^13.3.3
  flutter_secure_storage: ^9.2.2
  path: ^1.9.0
  path_provider: ^2.1.4
  pdf: ^3.11.1
  sqlite3_flutter_libs: ^0.5.24
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/fonts/
  fonts:
    - family: Doto
      fonts:
        - asset: assets/fonts/Doto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Doto-Black.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-SemiBoldItalic.ttf
          weight: 600
          style: italic
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf

flutter_launcher_icons:
  android: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#080808"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  min_sdk_android: 24
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256
